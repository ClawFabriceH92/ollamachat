name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Real device tests on an emulator: Room migrations, the SQLCipher upgrade
  # and the R8-minified build are things only a running Android can confirm.
  instrumented:
    runs-on: ubuntu-latest
    # A hung emulator must fail, not burn an hour.
    timeout-minutes: 30
    env:
      OLLAMACHAT_KEYSTORE_B64: ${{ secrets.OLLAMACHAT_KEYSTORE_B64 }}
      OLLAMACHAT_KEYSTORE_PASSWORD: ${{ secrets.OLLAMACHAT_KEYSTORE_PASSWORD }}
      OLLAMACHAT_KEY_PASSWORD: ${{ secrets.OLLAMACHAT_KEY_PASSWORD }}
      OLLAMACHAT_KEY_ALIAS: ${{ secrets.OLLAMACHAT_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Two separate invocations on purpose: the Room schemas are written by
      # KSP during assembleDebug, and the androidTest assets that reference
      # them are merged in the next one.
      - name: Pre-build (outside the emulator)
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleDebugAndroidTest --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon
            bash scripts/smoke-release-apk.sh

      # "0 tests found" also exits 0, which would make this whole job a
      # decorative green tick.
      - name: Assert instrumented tests actually ran
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'{len(files)} fichier(s) de résultats, {total} test(s)')
          if total == 0:
              sys.exit('Aucun test instrumenté exécuté')
          EOF

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: instrumented
    env:
      OLLAMACHAT_KEYSTORE_B64: ${{ secrets.OLLAMACHAT_KEYSTORE_B64 }}
      OLLAMACHAT_KEYSTORE_PASSWORD: ${{ secrets.OLLAMACHAT_KEYSTORE_PASSWORD }}
      OLLAMACHAT_KEY_PASSWORD: ${{ secrets.OLLAMACHAT_KEY_PASSWORD }}
      OLLAMACHAT_KEY_ALIAS: ${{ secrets.OLLAMACHAT_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          sdkmanager --licenses >/dev/null 2>&1 || true
        shell: bash

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assert unit tests actually ran
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'{len(files)} classe(s) de test, {total} test(s) unitaires')
          if total < 40:
              sys.exit(f'Trop peu de tests exécutés ({total})')
          EOF

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollamachat-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          # Create the release once, then overwrite the asset in place so the
          # download URL never 404s between two builds.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "OllamaChat v${VER}" --notes "Build automatique — v${VER}"
          gh release edit latest --title "OllamaChat v${VER}" --notes "Build automatique — v${VER}"
          for i in 1 2 3 4 5; do
            gh release upload latest "$APK" --clobber && break
            sleep 10
          done
          # A rolling release accumulates assets; leaving an older APK behind
          # lets the in-app updater install a previous version.
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx 'app-release.apk' \
            | while read -r stale; do gh release delete-asset latest "$stale" -y || true; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
