name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OLLAMACHAT_KEYSTORE_B64: ${{ secrets.OLLAMACHAT_KEYSTORE_B64 }}
      OLLAMACHAT_KEYSTORE_PASSWORD: ${{ secrets.OLLAMACHAT_KEYSTORE_PASSWORD }}
      OLLAMACHAT_KEY_PASSWORD: ${{ secrets.OLLAMACHAT_KEY_PASSWORD }}
      OLLAMACHAT_KEY_ALIAS: ${{ secrets.OLLAMACHAT_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          sdkmanager --licenses >/dev/null 2>&1 || true
        shell: bash

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish "latest" release
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          for i in 1 2 3 4 5; do
            gh release delete latest --yes 2>/dev/null || true
            gh release create latest "$APK" --title "OllamaChat v${VER}" --notes "Build automatique — v${VER}" && break
            sleep 10
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
