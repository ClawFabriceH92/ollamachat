name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OLLAMACHAT_KEYSTORE_B64: ${{ secrets.OLLAMACHAT_KEYSTORE_B64 }}
      OLLAMACHAT_KEYSTORE_PASSWORD: ${{ secrets.OLLAMACHAT_KEYSTORE_PASSWORD }}
      OLLAMACHAT_KEY_PASSWORD: ${{ secrets.OLLAMACHAT_KEY_PASSWORD }}
      OLLAMACHAT_KEY_ALIAS: ${{ secrets.OLLAMACHAT_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          sdkmanager --licenses >/dev/null 2>&1 || true
        shell: bash

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollamachat-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          # Create the release once, then overwrite the asset in place so the
          # download URL never 404s between two builds.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "OllamaChat v${VER}" --notes "Build automatique — v${VER}"
          gh release edit latest --title "OllamaChat v${VER}" --notes "Build automatique — v${VER}"
          for i in 1 2 3 4 5; do
            gh release upload latest "$APK" --clobber && break
            sleep 10
          done
          # A rolling release accumulates assets; leaving an older APK behind
          # lets the in-app updater install a previous version.
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx 'app-release.apk' \
            | while read -r stale; do gh release delete-asset latest "$stale" -y || true; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
